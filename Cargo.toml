[package]
name = "black-png"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Brendan-Black/black-png"
description = "PNG images, with no third-party dependencies"

# No third-party crates. black-zlib is our own, pinned to a release tag.
[dependencies]
black-zlib = { git = "https://github.com/Brendan-Black/black-zlib", tag = "v0.1.0" }

[package.metadata.black]
version = "0.2.3"

# black-rust: compiler and Clippy lints. Owned by cargo black; edit it in black-rust, not here.
# Everything else is rustc's and Clippy's defaults, which `cargo black check` runs with -D warnings.
[lints.rust]
# black errors/dont-swallow (correctness): an ignored Result is a swallowed error. forbid, so no #[allow] lifts it.
unused_must_use = "forbid"

[lints.clippy]
# black errors/dont-swallow: `let _ = result;` discards an error on purpose; handle it, or say why with #[expect].
let_underscore_must_use = "warn"
# black errors/messages-for-debuggers: expect("why this can't fail") says what broke; unwrap() doesn't. Tests may unwrap.
unwrap_used = "warn"
